name: Deploy (production)

# Builds and deploys to Vercel production on every push to main.
#
# BEFORE THIS WORKS, the New Start MD Vercel team + project must exist and TWO
# things must be set:
#   1. Repo secret VERCEL_TOKEN — a token scoped to the New Start MD Vercel team
#      (Vercel → Account/Team Settings → Tokens).
#   2. The VERCEL_ORG_ID / VERCEL_PROJECT_ID below — replace the placeholders
#      with the real values Vercel writes to .vercel/project.json after the
#      first `vercel link`. These IDs are NOT secret.
#
# Until VERCEL_TOKEN is set, this job SKIPS (stays green) rather than failing
# every commit — same pattern as the FitClinicMD marketing repo.

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  # TODO: replace with the New Start MD Vercel team + project IDs once created.
  VERCEL_ORG_ID: REPLACE_WITH_NEW_START_TEAM_ID
  VERCEL_PROJECT_ID: REPLACE_WITH_NEW_START_PROJECT_ID

jobs:
  deploy:
    name: Build & deploy to Vercel
    runs-on: ubuntu-latest
    steps:
      - name: Check for VERCEL_TOKEN
        id: check
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -z "$VERCEL_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "::warning::VERCEL_TOKEN secret is not set — skipping deploy. Add it in Settings → Secrets and variables → Actions once the Vercel project exists."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout
        if: steps.check.outputs.has_token == 'true'
        uses: actions/checkout@v4

      - name: Set up Node
        if: steps.check.outputs.has_token == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 20

      - name: Install Vercel CLI
        if: steps.check.outputs.has_token == 'true'
        run: npm install --global vercel@latest

      - name: Pull Vercel environment (production)
        if: steps.check.outputs.has_token == 'true'
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Build
        if: steps.check.outputs.has_token == 'true'
        run: vercel build --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      - name: Deploy to production
        if: steps.check.outputs.has_token == 'true'
        run: vercel deploy --prebuilt --prod --token="$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
